# À placer dans le repo Lehena : .github/workflows/build-backend.yml
#
# À chaque push sur `main` qui touche apps/backend/**, build l'image Docker
# et la publie sur GHCR. Watchtower (côté VPS) détectera la nouvelle image
# `latest` et redéploiera automatiquement.

name: Build & publish backend

on:
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - "apps/backend/Dockerfile"
      - ".github/workflows/build-backend.yml"
  workflow_dispatch:

env:
  # Hardcodé en minuscule : GHCR normalise mais Docker rejette le mixed-case au pull
  IMAGE_NAME: ghcr.io/paul-l/lehena-backend

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Résumé
        run: |
          echo "Image publiée avec tags :" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "Watchtower mettra à jour le VPS dans les 5 prochaines minutes." >> $GITHUB_STEP_SUMMARY
