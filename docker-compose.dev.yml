# Lehena — local development services
# ─────────────────────────────────────
# Boot with:   docker compose -f docker-compose.dev.yml up -d
# Stop with:   docker compose -f docker-compose.dev.yml down
# Wipe data:   docker compose -f docker-compose.dev.yml down -v
#
# Services exposed on host:
#   - postgres      → localhost:5432   (creds: medusa / medusa)
#   - redis         → localhost:6379
#   - minio (s3)    → localhost:9100   (api), localhost:9101 (console; creds: minioadmin / minioadmin)
#   - meilisearch   → localhost:7700
#
# All services are gated behind healthchecks so dependent processes
# (Medusa, seeds, CI scripts) can wait for them.

name: lehena-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: medusa
      POSTGRES_DB: lehena_dev
    ports:
      - "5432:5432"
    volumes:
      - lehena_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medusa -d lehena_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - lehena_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - lehena_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot init: create the media bucket and a long-lived access key for
  # Medusa's S3 file module. Idempotent — re-running does nothing.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mc alias set local http://minio:9000 minioadmin minioadmin
        mc mb --ignore-existing local/lehena-media
        mc anonymous set download local/lehena-media
        echo "MinIO bucket lehena-media ready."

  meilisearch:
    image: getmeili/meilisearch:v1.11
    restart: unless-stopped
    environment:
      MEILI_ENV: development
      # In dev, no master key required; storefront uses the host directly.
      # Set MEILI_MASTER_KEY here in staging/prod.
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - lehena_meili:/meili_data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  lehena_pgdata:
  lehena_redis:
  lehena_minio:
  lehena_meili:
