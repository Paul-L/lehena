name: E2E

on:
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Storefront URL to test against"
        required: true

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright — critical path + SEO
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
          run_install: false

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Resolve preview URL
        id: preview
        run: |
          if [ -n "${{ inputs.base_url }}" ]; then
            echo "url=${{ inputs.base_url }}" >> "$GITHUB_OUTPUT"
          else
            URL=$(gh pr view "${{ github.event.pull_request.number }}" --json comments \
              --jq '.comments[].body' \
              | grep -oE 'https://lehena-storefront-[^"]+vercel.app' \
              | head -n1 || true)
            if [ -z "$URL" ]; then
              echo "::warning::No Vercel preview URL — skipping E2E"
              echo "url=" >> "$GITHUB_OUTPUT"
            else
              echo "url=$URL" >> "$GITHUB_OUTPUT"
            fi
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run Playwright
        if: steps.preview.outputs.url != ''
        env:
          E2E_BASE_URL: ${{ steps.preview.outputs.url }}
        run: pnpm exec playwright test

      - name: Upload Playwright report
        if: always() && steps.preview.outputs.url != ''
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
