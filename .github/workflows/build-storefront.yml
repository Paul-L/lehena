# À chaque push sur `main` qui touche apps/storefront/**, build l'image Docker
# du storefront Next.js et la publie sur GHCR. Watchtower (côté VPS) détectera
# la nouvelle image `latest` et redéploiera automatiquement.
#
# ⚠️ Les variables NEXT_PUBLIC_* sont inlinées dans le bundle AU BUILD (elles
# finissent publiques côté client), donc on les passe en build-args depuis les
# *repository variables* GitHub (Settings → Secrets and variables → Actions →
# Variables), pas en secrets. À définir avant le premier run :
#   - NEXT_PUBLIC_MEDUSA_BACKEND_URL     = https://backend.lehena.fr
#   - NEXT_PUBLIC_BASE_URL               = https://lehena.fr
#   - NEXT_PUBLIC_DEFAULT_REGION         = fr
#   - NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY = pk_... (créée dans l'admin Medusa)
#   - NEXT_PUBLIC_PLAUSIBLE_DOMAIN / NEXT_PUBLIC_SENTRY_DSN (optionnels)

name: Build & publish storefront

on:
  push:
    branches: [main]
    paths:
      - "apps/storefront/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/build-storefront.yml"
  workflow_dispatch:

env:
  # Hardcodé en minuscule : GHCR normalise mais Docker rejette le mixed-case au pull
  IMAGE_NAME: ghcr.io/paul-l/lehena-storefront

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=,format=long
            type=ref,event=branch
            type=semver,pattern={{version}}

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/storefront/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_MEDUSA_BACKEND_URL=${{ vars.NEXT_PUBLIC_MEDUSA_BACKEND_URL }}
            NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_BASE_URL=${{ vars.NEXT_PUBLIC_BASE_URL }}
            NEXT_PUBLIC_DEFAULT_REGION=${{ vars.NEXT_PUBLIC_DEFAULT_REGION }}
            NEXT_PUBLIC_PLAUSIBLE_DOMAIN=${{ vars.NEXT_PUBLIC_PLAUSIBLE_DOMAIN }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            MEDUSA_BACKEND_HOSTNAME=${{ vars.MEDUSA_BACKEND_HOSTNAME }}
            MEDUSA_BACKEND_PROTOCOL=${{ vars.MEDUSA_BACKEND_PROTOCOL }}

      - name: Résumé
        run: |
          echo "Image storefront publiée avec tags :" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "Watchtower mettra à jour le VPS dans les 5 prochaines minutes." >> $GITHUB_STEP_SUMMARY
